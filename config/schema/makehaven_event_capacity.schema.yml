makehaven_event_capacity.settings:
  type: config_object
  label: 'MakeHaven Event Capacity Settings'
  mapping:
    marketing_early_bird_threshold:
      type: integer
      label: 'Early Bird Capacity Threshold (%)'
    marketing_early_bird_days:
      type: integer
      label: 'Early Bird Days in Advance'
    marketing_early_bird_discount:
      type: integer
      label: 'Early Bird Discount (%)'
    marketing_flash_sale_threshold:
      type: integer
      label: 'Flash Sale Capacity Threshold (%)'
    marketing_flash_sale_days:
      type: integer
      label: 'Flash Sale Days in Advance'
    marketing_flash_sale_discount:
      type: integer
      label: 'Flash Sale Discount (%)'
    marketing_notification_email:
      type: string
      label: 'Notification Email'
    marketing_notification_hours:
      type: integer
      label: 'Cancellation Warning Hours'
    site_base_url:
      type: string
      label: 'Site base URL for links in notification emails'
    seat_fill_event_types:
      type: sequence
      label: 'CiviCRM event types the seat-fill rules apply to'
      sequence:
        type: integer
    seat_fill_include_gems:
      type: boolean
      label: 'Also apply to GEMS cohorts (Program events titled GEMS)'
    seat_fill_run_threshold:
      type: integer
      label: 'Percent of seats sold to attendees for a class to count as running'
    seat_fill_at_risk_days:
      type: integer
      label: 'Days before start that an under-threshold class shows as at risk'
    member_deal_enabled:
      type: boolean
      label: 'Send the last-minute member deal'
    member_deal_lead_hours:
      type: integer
      label: 'Hours before start the deal goes out'
    member_deal_min_lead_hours:
      type: integer
      label: 'Never send the deal later than this many hours before start'
    member_deal_min_seats:
      type: integer
      label: 'Minimum seats left for a deal'
    member_deal_discount:
      type: integer
      label: 'Deal discount (%)'
    member_deal_group:
      type: string
      label: 'CiviCRM group name holding the opt-ins'
    member_deal_subject:
      type: label
      label: 'Deal email subject'
    member_deal_body:
      type: text
      label: 'Deal email body'

field.formatter.settings.makehaven_event_capacity_message:
  type: mapping
  label: 'Smart capacity message formatter settings'
  mapping:
    threshold:
      type: integer
      label: 'Low availability threshold'
    message_full:
      type: label
      label: 'Full message'
    message_low:
      type: label
      label: 'Low availability message'
    message_open:
      type: label
      label: 'Open message'
    show_open:
      type: boolean
      label: 'Show the open message'
    hide_past_events:
      type: boolean
      label: 'Hide message once the event has passed'

field.formatter.settings.makehaven_event_marketing_message:
  type: mapping
  label: 'Marketing message formatter settings'
  mapping:
    message_early_bird:
      type: label
      label: 'Early Bird Message'
    message_flash_sale:
      type: label
      label: 'Flash Sale Message'
    message_at_risk:
      type: label
      label: 'At risk message'
