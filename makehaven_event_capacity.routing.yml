makehaven_event_capacity.settings:
  path: '/admin/config/makerspace/event-capacity'
  defaults:
    _form: '\Drupal\makehaven_event_capacity\Form\MakeHavenEventCapacitySettingsForm'
    _title: 'MakeHaven Event Capacity Settings'
  requirements:
    _permission: 'administer site configuration'
makehaven_event_capacity.member_deals:
  path: '/member-deals'
  defaults:
    _form: '\Drupal\makehaven_event_capacity\Form\MemberDealsOptInForm'
    _title: 'Last-minute member deals'
  requirements:
    # Open to all: the form explains the perk to non-members and only lets
    # members join.
    _access: 'TRUE'

makehaven_event_capacity.member_deals_leave:
  path: '/member-deals/leave/{contact_id}/{token}'
  defaults:
    _form: '\Drupal\makehaven_event_capacity\Form\MemberDealsLeaveForm'
    _title: 'Member deals'
  requirements:
    _access: 'TRUE'
    contact_id: \d+
